services:
  mqtt-web:
    image: ${MQTT_WEB_IMAGE:-mqtt-web:local}
    build:
      context: ..
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      MQTT_URL: "${MQTT_URL:-}"
      MQTT_ROOT_FILTER: "${MQTT_ROOT_FILTER:-#}"
      MQTT_USERNAME: "${MQTT_USERNAME:-}"
      MQTT_PASSWORD: "${MQTT_PASSWORD:-}"
      MQTT_QOS: ${MQTT_QOS:-0}
      MAX_MESSAGES_PER_TOPIC: ${MAX_MESSAGES_PER_TOPIC:-100}
      MESSAGES_PER_PAGE: ${MESSAGES_PER_PAGE:-100}
      MAX_PAYLOAD_PREVIEW: ${MAX_PAYLOAD_PREVIEW:-65536}
      TOPIC_CHILDREN_PER_PAGE: 200
    extra_hosts:
      - "host.docker.internal:host-gateway"
