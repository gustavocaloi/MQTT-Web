<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MQTT Web</title>
    <link rel="icon" href="../img/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="../img/8A8C208C-9815-4E32-B7F8-388442729C6B.png" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('mqtt-web-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20260513-10" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="../img/8A8C208C-9815-4E32-B7F8-388442729C6B.png" alt="MQTT Web" />
          <div>
            <h1>MQTT Web</h1>
            <p>Leitura em tempo real por topico</p>
          </div>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">
            <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 4V2m0 20v-2m8-8h2M2 12h2m14.95-6.95 1.42-1.42M3.63 20.37l1.42-1.42m0-13.9L3.63 3.63m16.74 16.74-1.42-1.42M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
            </svg>
            <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20.5 14.8A8.5 8.5 0 0 1 9.2 3.5 8.5 8.5 0 1 0 20.5 14.8Z" />
            </svg>
          </button>
          <a class="github-link" href="https://github.com/gustavocaloi/MQTT-Web" target="_blank" rel="noreferrer" aria-label="Abrir repositorio no GitHub" title="GitHub">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 .5a12 12 0 0 0-3.8 23.38c.6.1.82-.26.82-.58v-2.24c-3.34.73-4.04-1.42-4.04-1.42-.55-1.38-1.34-1.75-1.34-1.75-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.08 1.83 2.82 1.3 3.5.99.11-.78.42-1.3.76-1.6-2.66-.3-5.46-1.33-5.46-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23A11.5 11.5 0 0 1 12 6.28c1.02 0 2.05.14 3.02.41 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.62-5.48 5.92.43.37.82 1.1.82 2.22v3.3c0 .32.21.69.83.57A12 12 0 0 0 12 .5Z" />
            </svg>
          </a>
          <div class="status-card" id="connectionStatus">
            <span class="status-dot"></span>
            <div>
              <strong>Conectando</strong>
              <small>Aguardando broker</small>
            </div>
          </div>
        </div>
      </header>

      <section class="metrics" aria-label="Resumo">
        <article>
          <span id="topicCount">0</span>
          <p>Topicos</p>
        </article>
        <article>
          <span id="messageCount">0</span>
          <p>Mensagens</p>
        </article>
        <article>
          <span id="brokerUrl">-</span>
          <p>Broker</p>
        </article>
        <article>
          <span id="topicFilter">#</span>
          <p>Filtro</p>
        </article>
      </section>

      <section class="toolbar" aria-label="Ferramentas">
        <label class="search">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />
          </svg>
          <input id="searchInput" type="search" placeholder="Filtrar topicos, ex: flight/#" autocomplete="off" />
        </label>
        <button id="pauseButton" type="button" aria-pressed="false">
          <span class="pause-icon"></span>
          Pausar
        </button>
        <button id="clearButton" class="danger-button" type="button">
          Limpar
        </button>
      </section>

      <section id="topics" class="topics" aria-live="polite">
        <div class="empty-state">
          <h2>Nenhuma mensagem recebida ainda</h2>
          <p>Assim que o broker publicar algo no filtro configurado, os topicos aparecem aqui.</p>
        </div>
      </section>
    </main>

    <template id="topicNodeTemplate">
      <article class="topic-node">
        <div class="topic-row">
          <button class="topic-toggle" type="button">
            <span class="topic-caret" aria-hidden="true"></span>
            <div>
              <h2></h2>
              <p></p>
            </div>
            <span class="topic-count"></span>
          </button>
          <button class="topic-filter" type="button" title="Filtrar por este topico" aria-label="Filtrar por este topico">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M4 5h16l-6 7v5l-4 2v-7L4 5Z" />
            </svg>
          </button>
        </div>
        <div class="topic-children"></div>
      </article>
    </template>

    <template id="messageTemplate">
      <article class="message">
        <button class="message-summary" type="button">
          <span class="message-time"></span>
          <span class="badge"></span>
          <span class="badge retained">retained</span>
        </button>
        <pre hidden></pre>
      </article>
    </template>

    <script src="app.js?v=20260513-10" type="module"></script>
  </body>
</html>
